name: Build MCPE 0.15.10 arm64

# Se ejecuta a mano: pestaña Actions -> "Build MCPE 0.15.10 arm64" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout (aqui estan las partes del APK)
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clave de firma (se conserva entre compilaciones)
        uses: actions/cache@v4
        with:
          path: ~/.mcpe-arm64
          key: mcpe-signing-key-v1

      - name: Paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs libboost-dev ninja-build cmake unzip zip curl python3

      - name: Descargar el proyecto base (mcpe-arm64)
        run: |
          set -eux
          git clone https://github.com/yxrxtskxy/mcpe-arm64 proj
          git -C proj checkout 0c807a391f8e86e5268eb3026628426a34992ca5

      - name: Juntar y extraer el APK del juego
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          ls -la
          PARTS=$(ls | grep -E '\.zip\.[0-9]+$' | sort)
          if [ -z "$PARTS" ]; then
            echo "ERROR: no encuentro las partes .zip.001 / .zip.002 en la raiz del repositorio"
            exit 1
          fi
          echo "Partes: $PARTS"
          printf '%s\n' "$PARTS" | while IFS= read -r f; do cat "$f"; done > game.zip
          mkdir gamezip
          unzip -q game.zip -d gamezip
          APK=$(find gamezip -iname '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no hay ningun .apk dentro del zip"
            exit 1
          fi
          mkdir -p proj/game
          cp "$APK" proj/game/game.apk
          ls -la proj/game

      - name: Herramientas de Android (SDK y NDK r29)
        run: |
          set -eux
          sh proj/tools/setup_toolchain.sh
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses > /dev/null || true

      - name: Sysroot arm32 (descarga grande, tarda)
        run: |
          set -eux
          cd proj/upstream/ZettaBridge
          sh tools/extract_sysroot.sh
          rm -rf .cache/gsi

      - name: Comprobar compiladores del NDK
        run: |
          set -eux
          NDKDIR="$HOME/android-sdk/ndk/29.0.14206865"
          TC="$NDKDIR/toolchains/llvm/prebuilt/linux-x86_64"
          ls "$NDKDIR" | head -30
          ls "$TC/bin" | grep -E 'armv7a|^clang' | head -40 || true
          file "$TC/bin/clang" || true
          ldd "$(readlink -f "$TC/bin/clang")" | head -20 || true
          if ! "$TC/bin/armv7a-linux-androideabi21-clang" --version > /dev/null 2>&1; then
            echo "El compilador armv7a no funciona; creo los envoltorios a mano"
            printf '#!/bin/sh\nexec "$(dirname "$0")/clang" --target=armv7a-linux-androideabi21 "$@"\n' > "$TC/bin/armv7a-linux-androideabi21-clang"
            printf '#!/bin/sh\nexec "$(dirname "$0")/clang++" --target=armv7a-linux-androideabi21 "$@"\n' > "$TC/bin/armv7a-linux-androideabi21-clang++"
            chmod +x "$TC/bin/armv7a-linux-androideabi21-clang" "$TC/bin/armv7a-linux-androideabi21-clang++"
          fi
          "$TC/bin/armv7a-linux-androideabi21-clang" --version

      - name: Compilar
        run: |
          set -eux
          export SDK="$HOME/android-sdk"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export NDK="$SDK/ndk/29.0.14206865"
          export NDK_HOST=linux-x86_64
          ROOT="$GITHUB_WORKSPACE/proj"
          ZB="$ROOT/upstream/ZettaBridge"
          BT="$SDK/build-tools/35.0.0"
          GAME_APK="$ROOT/game/game.apk"
          INPUTS="$ROOT/build/app-inputs"
          RESULT="$GITHUB_WORKSPACE/result"
          mkdir -p "$RESULT"

          echo "=== Boost"
          mkdir -p "$ROOT/.deps/boost-headers"
          cp -r /usr/include/boost "$ROOT/.deps/boost-headers/"

          echo "=== clave de firma"
          sh "$ROOT/tools/make_signing_key.sh"

          echo "=== guest (arm32)"
          (cd "$ZB" && sh tools/build_guest.sh > /dev/null)

          echo "=== core arm64"
          cmake -S "$ZB" -B "$ZB/build/android-arm64" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release \
            -DZB_BUILD_TESTS=OFF -DBoost_INCLUDE_DIR="$ROOT/.deps/boost-headers"
          ninja -C "$ZB/build/android-arm64" zbridge zbproxy

          echo "=== bundle de ejecucion"
          (cd "$ZB" && sh tools/make_launcher_bundle.sh)

          echo "=== entradas de la app"
          rm -rf "$INPUTS"
          mkdir -p "$INPUTS/assets/game"
          cp -R "$ZB/build/launcher/assets/." "$INPUTS/assets/"
          cp -R "$ZB/build/launcher/jniLibs" "$INPUTS/jniLibs"
          cp "$GAME_APK" "$INPUTS/assets/game/base.apk"
          GAME_SHA=$(sha256sum "$GAME_APK" | cut -d' ' -f1)
          GAME_PACKAGE=$("$BT/aapt2" dump packagename "$GAME_APK")
          GAME_VERSION=$("$BT/aapt2" dump badging "$GAME_APK" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          [ -n "$GAME_VERSION" ] || GAME_VERSION="0.15.10"
          printf 'package=%s\nsha256=%s\nversionName=%s\n' "$GAME_PACKAGE" "$GAME_SHA" "$GAME_VERSION" \
            > "$INPUTS/assets/game/info.properties"
          cat "$INPUTS/assets/game/info.properties"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$INPUTS/res/mipmap-$density"
            unzip -p "$GAME_APK" "res/drawable-$density-v4/icon.png" > "$INPUTS/res/mipmap-$density/ic_launcher.png"
          done

          echo "=== nombre de la app"
          sed -i 's|<string name="app_name">Minecraft PE</string>|<string name="app_name">Minecraft PE 0.15 (64 bits)</string>|' \
            "$ROOT/android/app/src/main/res/values/strings.xml"

          echo "=== gradle assembleRelease"
          (cd "$ROOT/android" && gradle --no-daemon assembleRelease)
          BUILT="$ROOT/android/app/build/outputs/apk/release/app-release.apk"

          echo "=== comprobaciones"
          "$BT/zipalign" -c -P 16 4 "$BUILT" && echo "zipalign OK"
          "$BT/apksigner" verify --print-certs "$BUILT" | head -3
          "$BT/aapt2" dump badging "$BUILT" | grep -E "^package|native-code|launchable-activity|sdkVersion|targetSdkVersion"

          cp "$BUILT" "$RESULT/MinecraftPE-0.15-arm64.apk"
          sha256sum "$RESULT/MinecraftPE-0.15-arm64.apk"
          ls -la "$RESULT"

      - name: Subir el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftPE-0.15-arm64
          path: result/MinecraftPE-0.15-arm64.apk
          if-no-files-found: error
